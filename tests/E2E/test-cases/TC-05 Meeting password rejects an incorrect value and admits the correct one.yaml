customSteps: |
    // The same guest must be rejected and then admitted; a dialog alone does not prove enforcement.
    generate from regex "trlock[a-z]{20}" and save as "roomName"
    generate from regex "Key[a-z]{20}" and save as "meetingPassword"
    save value "TRLockHost" as "participantName"
    jitsi-open-room
    jitsi-join-conference
    jitsi-open-security
    click "Add password"
    enter stored value "meetingPassword" into "Password"
    click button "Add"
    wait up to 30 seconds until page contains button "Remove"
    click "Close dialog"

    start browser "LockedGuest" and switch
    reset to home
    jitsi-open-room
    enter "TRLockGuest" into "Enter your name"
    click button "Join meeting"
    wait up to 30 seconds until page contains "Password required"
    enter "DeliberatelyWrongPassword" into "Password"
    click button "OK"
    // Wait for the prompt to return after the failed join, then verify the host still has no guest.
    wait up to 30 seconds until page contains "Password required"
    switch to browser "default"
    hover over the middle of the screen
    click "Open participants panel"
    check that page contains "TRLockHost"
    check that page does not contain "TRLockGuest"

    switch to browser "LockedGuest"
    enter stored value "meetingPassword" into "Password"
    click button "OK"
    wait up to 60 seconds until page does not contain "Password required"
    hover over the middle of the screen
    click "Open participants panel"
    wait up to 30 seconds until page contains "TRLockHost"
    check that page contains "TRLockGuest"
    switch to browser "default"
    wait up to 30 seconds until page contains "TRLockGuest"
    check that page contains "TRLockHost"
    click "Close participants pane"
    jitsi-open-security
    click button "Remove"
    wait up to 30 seconds until page contains "Add password"
    click "Close dialog"
    switch to browser "LockedGuest"
    click "Close participants pane"
    jitsi-leave-conference
    switch to browser "default"
    jitsi-leave-conference
