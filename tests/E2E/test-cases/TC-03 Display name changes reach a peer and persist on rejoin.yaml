customSteps: |
    generate from regex "trprofile[a-z]{20}" and save as "roomName"
    generate from regex "TRRenamed[a-z]{14}" and save as "updatedName"
    save value "TRBefore" as "participantName"
    jitsi-open-room
    jitsi-join-conference

    start browser "Observer" and switch
    reset to home
    save value "TRWatcher" as "participantName"
    jitsi-open-room
    jitsi-join-conference
    click "Open participants panel"
    wait up to 30 seconds until page contains "TRBefore"
    check that page does not contain stored value from "updatedName"

    switch to browser "default"
    hover over the middle of the screen
    click "More actions"
    click "Settings"
    click "Profile"
    enter stored value "updatedName" into "Name"
    click button "OK"

    // A remote roster proves that the change was broadcast rather than merely edited locally.
    switch to browser "Observer"
    wait up to 30 seconds until page contains stored value from "updatedName"
    check that page does not contain "TRBefore"
    check that page contains "TRWatcher"

    switch to browser "default"
    jitsi-leave-conference
    switch to browser "Observer"
    wait up to 30 seconds until page does not contain stored value from "updatedName"
    check that page contains "TRWatcher"
    switch to browser "default"
    jitsi-open-room
    // Read the saved value before typing anything into the name field.
    grab value from "Enter your name" and save it as "persistedName"
    check that stored value "persistedName" itself is equal to stored value "updatedName"
    click button "Join meeting"
    wait up to 60 seconds until page does not contain button "Join meeting"
    check that page contains stored value from "updatedName"
    switch to browser "Observer"
    wait up to 30 seconds until page contains stored value from "updatedName"
    check that page contains "TRWatcher"

    switch to browser "default"
    jitsi-leave-conference
    switch to browser "Observer"
    click "Close participants pane"
    jitsi-leave-conference
